name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  IMAGE_NAME: firebase-email-link-host

jobs:
  version:
    name: Validate VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate VERSION vs tag
        id: read
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Git tag ($GITHUB_REF_NAME) must match VERSION file (v$VERSION). Bump VERSION, run bun run version:sync, commit, then tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

  docker:
    name: Multi-arch Docker Hub image
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          provenance: false

  binaries:
    name: Cross-compile Go binaries
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          EXT="${{ matrix.ext }}"
          OUT="dist/email-link-host_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
          go build -trimpath \
            -ldflags="-s -w -X email-link-host/internal/version.Version=${VERSION}" \
            -o "$OUT" ./cmd/server
          if [ "${{ matrix.goos }}" != "windows" ]; then chmod +x "$OUT"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, docker, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Checksums + packaging extras
        run: |
          cd dist
          sha256sum email-link-host_* > checksums.txt
          cd ..
          cp compose.yml .env.example VERSION dist/
          cp config/site.json dist/site.example.json
          cp Dockerfile dist/Dockerfile

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Version

            `${{ needs.version.outputs.version }}` (from root `VERSION`; shared by Next, docs, Go, Docker)

            ## Docker (multi-arch)

            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ```

            Platforms: `linux/amd64`, `linux/arm64`.

            ```bash
            docker run --rm -p 8080:8080 --env-file .env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ## Release assets

            - Go binaries: Linux / macOS / Windows (amd64/arm64 where applicable)
            - `checksums.txt`, `VERSION`
            - `compose.yml`, `.env.example`, `site.example.json`, `Dockerfile`

            ## Docs

            https://rutvik24.github.io/firebase-email-link-host/
          files: |
            dist/email-link-host_*
            dist/checksums.txt
            dist/VERSION
            dist/compose.yml
            dist/.env.example
            dist/site.example.json
            dist/Dockerfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
